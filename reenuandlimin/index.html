<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Renu &amp; Limin — Wedding Invitation · 04 Jan 2027</title>
  <meta name="description" content="With joy we invite you to the wedding of Renu Elizabeth Kuruvilla &amp; Limin Thomas. St. George Orthodox Church, Chathannoor (Valiyapally). Monday, 4 January 2027, 11 AM." />

  <!-- Social share preview -->
  <meta property="og:title" content="Renu &amp; Limin's Wedding — 4 January 2027" />
  <meta property="og:description" content="St. George Orthodox Church, Chathannoor (Valiyapally) · Monday, 4 January 2027 · 11 AM" />
  <meta property="og:image" content="images/hero.png" />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Marcellus&family=Cormorant+SC:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ============ OPENING / COVER ============ -->
  <main class="cover">
    <div class="hero__bg" style="background-image:url('images/hero.png')"></div>
    <div class="hero__overlay"></div>

    <div class="cover__content">
      <p class="hero__eyebrow">Together with their families</p>
      <div class="hero__cross">&#10013;</div>
      <h1 class="hero__names">
        <span>Renu</span>
        <span class="hero__amp">&amp;</span>
        <span>Limin</span>
      </h1>
      <p class="hero__tag">are getting married</p>

      <div class="hero__date">
        <span>Monday</span>
        <span class="hero__date-main">04 &middot; 01 &middot; 2027</span>
        <span>St. George Orthodox Church, Chathannoor</span>
      </div>

      <!-- Countdown -->
      <div class="cover__count">
        <div class="count__grid" id="countdown">
          <div class="count__box"><span class="count__num" id="cd-days">--</span><span class="count__label">Days</span></div>
          <div class="count__box"><span class="count__num" id="cd-hours">--</span><span class="count__label">Hours</span></div>
          <div class="count__box"><span class="count__num" id="cd-mins">--</span><span class="count__label">Minutes</span></div>
          <div class="count__box"><span class="count__num" id="cd-secs">--</span><span class="count__label">Seconds</span></div>
        </div>
        <p class="count__done count__done--light" id="cd-done" hidden>Today is the day. Praise God! &#10013;</p>
      </div>

      <!-- Button that opens the full invitation -->
      <a href="invitation.html" class="cover__btn">
        <span class="cover__btn-cross">&#10013;</span>
        Open Invitation
      </a>
    </div>
  </main>

  <!-- Background music -->
  <audio id="bgMusic" src="music.mp3" loop preload="none"></audio>
  <button id="musicBtn" class="music-btn" type="button" aria-label="Play music" title="Play music">&#9835;</button>

  <script src="script.js"></script>
</body>
</html>
